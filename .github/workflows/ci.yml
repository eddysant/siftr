name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the requires-python floor; 3.13 is the current release.
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        # Deliberately not the full extras: the suite is hermetic and needs
        # neither torch nor onnxruntime, so CI stays fast and offline.
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow pytest ruff
      - name: Lint
        run: ruff check siftr tests
      - name: Format check
        run: ruff format --check siftr tests
      - name: Test
        run: pytest -q
