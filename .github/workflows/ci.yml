name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the requires-python floor; 3.13 is the current release.
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        # --no-deps deliberately skips torch/open_clip/onnxruntime: the suite is
        # hermetic (fake embedder, stub face analyzer), so CI stays fast and
        # needs no model downloads. The package itself must still be installed
        # or `import siftr` fails in conftest.
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow pytest ruff
          pip install --no-deps -e .
      - name: Lint
        run: ruff check siftr tests
      - name: Format check
        run: ruff format --check siftr tests
      - name: Test
        run: pytest -q

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run
      - name: Build
        # Catches the class of bug that only appears at bundle time — the
        # preload must come out as CommonJS or Electron silently refuses it.
        run: npx vite build
      - name: Check the preload is CommonJS
        # A sandboxed Electron preload cannot be ESM. Built as ESM it fails at
        # runtime with only "Unable to load preload script", so assert the shape
        # here rather than discovering it by launching the app.
        run: |
          if grep -q '^import ' dist-electron/preload.mjs; then
            echo "::error::preload.mjs is ESM; Electron requires CommonJS"
            exit 1
          fi
          echo "preload is CommonJS"
